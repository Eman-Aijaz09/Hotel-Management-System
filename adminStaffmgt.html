<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Staff - EA Hotel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: #1c1b29;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-size: 16px;
    }

    .nav-links a:hover {
      color: #ffcc00;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .hero {
      background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c');
      background-size: cover;
      background-position: center;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .hero-content {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 10px;
    }

    .hero-content h1 {
      font-size: 32px;
    }

    .container {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background-color: #1c1b29;
      color: white;
    }

    tr:hover {
      background-color: #f0f0f0;
    }

    button {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

<header class="navbar">
  <div class="logo">🔒 Admin Panel - EA Hotel</div>
  <nav class="nav-links" style="display: flex; align-items: center; gap: 25px;">
    <a href="admin.html">Dashboard</a>
    <a href="login.html">Logout</a>
    <div style="display: flex; align-items: center; gap: 6px; font-weight: bold;">
      <span>👤</span>
      <span id="admin-name"></span>
      <span style="font-size: 14px; opacity: 0.8;">(<span id="role-label"></span>)</span>
    </div>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Manage Staff</h1>
  </div>
</section>

<div class="container">
  <table id="staffTable">
    <thead>
      <tr>
        <th>Staff ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Staff will be inserted here -->
    </tbody>
  </table>
</div>

<script>
  const adminName = localStorage.getItem("adminUsername");
  const adminRole = localStorage.getItem("adminRole");

  if (!adminName || adminRole !== "admin") {
    window.location.href = "login.html";
  } else {
    document.getElementById("admin-name").textContent = adminName;
    document.getElementById("role-label").textContent = adminRole;
  }

  async function fetchStaff() {
    try {
      const res = await fetch("http://localhost:5189/staff");
      console.log("Response Status:", res.status);

      if (!res.ok) throw new Error(`Failed to fetch: ${res.status}`);

      const users = await res.json();
      console.log("Fetched users:", users);
      const tbody = document.querySelector("#staffTable tbody");
      tbody.innerHTML = "";

      users.forEach(user => {
          const id = user.userId;
          const name =user.username;
          const email = user.email;
          const role = user.role;

 const row = document.createElement("tr");
row.innerHTML = `
  <td>${id}</td>
  <td>${name}</td>
  <td>${email}</td>
  <td>${role}</td>
  <td><button onclick="deleteStaff('${id}', this)">Delete</button></td>
`;
          tbody.appendChild(row);
          console.log("Row added:", row); // Log the row to verify it’s added
        });

    } catch (err) {
      console.error("Unable to load staff list: " + error.message);
      alert("Unable to load staff list.");
      console.error(error);
    }
  }

  async function deleteStaff(staffId, btn) {
    if (!confirm("Are you sure you want to delete this staff member?")) return;

    try {
      const res = await fetch(`http://localhost:5189/staff/${staffId}`, {
        method: "DELETE",
      });

      if (res.ok) {
        btn.closest("tr").remove();
      } else {
        alert("Failed to delete staff member.");
      }
    } catch (err) {
      console.error("Delete error:", err);
      alert("Error deleting staff member.");
    }
  }

  fetchStaff();
</script>

</body>
</html>
