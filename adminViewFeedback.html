<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Feedback - EA Hotel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: #1c1b29;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }
.nav-links {
  display: flex;
  align-items: center;
  gap: 25px;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: bold;
  margin-left: 40px; /* add space between links and user */
}

.user-info span:first-child {
  font-size: 18px;
}
.user-info span:nth-child(2) {
  color: #ffffff;
}
.user-info span:nth-child(3) {
  font-size: 13px;
  opacity: 0.8;
}
    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-size: 16px;
    }

    .nav-links a:hover {
      color: #ffcc00;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .hero {
      background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c');
      background-size: cover;
      background-position: center;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .hero-content {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 10px;
    }

    .hero-content h1 {
      font-size: 32px;
    }

    .container {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background-color: #1c1b29;
      color: white;
    }

    tr:hover {
      background-color: #f0f0f0;
    }

    button {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

<header class="navbar">
  <div class="logo">🔒 Admin Panel - EA Hotel</div>
<nav class="nav-links">
  <a href="admin.html">Dashboard</a>
  <a href="login.html">Logout</a>

  <div class="user-info">
    <span>👤</span>
    <span id="admin-name"></span>
    <span>(<span id="role-label"></span>)</span>
  </div>
</nav>

</header>

<section class="hero">
  <div class="hero-content">
    <h1>Manage Guest Feedback</h1>
  </div>
</section>

<div class="container">
  <table id="feedbackTable">
    <thead>
      <tr>
        <th>Feedback ID</th>
        <th>Stars</th>
        <th>Description</th>
        <th>User</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Feedback rows will be injected here -->
    </tbody>
  </table>
</div>

<script>
  const adminName = localStorage.getItem("adminUsername");
  const adminRole = localStorage.getItem("adminRole");

  if (!adminName || adminRole !== "admin") {
    window.location.href = "login.html";
  } else {
    document.getElementById("admin-name").textContent = adminName;
    document.getElementById("role-label").textContent = adminRole;
  }

  async function fetchFeedback() {
    try {
      const res = await fetch("http://localhost:5189/feedback");
      console.log("Response Status:", res.status);

      if (!res.ok) throw new Error(`Failed to fetch: ${res.status}`);

      const feedbackList = await res.json();
      console.log("Fetched feedback:", feedbackList);

      const tbody = document.querySelector("#feedbackTable tbody");
      tbody.innerHTML = "";

      feedbackList.forEach(fb => {
        const userDisplay = fb.feedbackType === "Anonymous"
          ? "Anonymous"
          : `${fb.userId} (${fb.username})`;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${fb.feedbackId}</td>
          <td>${fb.stars}</td>
          <td>${fb.description}</td>
          <td>${userDisplay}</td>
          <td><button onclick="deleteFeedback('${fb.feedbackId}', this)">Delete</button></td>
        `;
        tbody.appendChild(row);
      });

    } catch (error) {
      console.error("Unable to load feedback:", error.message);
      alert("Unable to load feedback list.");
    }
  }

  async function deleteFeedback(feedbackId, btn) {
    if (!confirm("Are you sure you want to delete this feedback?")) return;

    try {
      const res = await fetch(`http://localhost:5189/feedback/${feedbackId}`, {
        method: "DELETE"
      });

      if (res.ok) {
        btn.closest("tr").remove();
      } else {
        alert("Failed to delete feedback.");
      }
    } catch (err) {
      console.error("Delete error:", err);
      alert("Error deleting feedback.");
    }
  }

  window.onload = fetchFeedback;
</script>

</body>
</html>
